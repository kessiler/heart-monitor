name: Reusable checks

on:
  workflow_call:
    inputs:
      pages:
        description: Build and upload the GitHub Pages artifact after validation
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    name: Rust, browser and static build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: '1.99.0'
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Install locked JavaScript dependencies
        run: npm ci
      - name: Check consistent application versions
        run: node scripts/check-release.mjs
      - name: Check Rust formatting
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Test the Rust processing core
        run: cargo test --workspace --locked
      - name: Check Rust lints
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test browser helpers
        run: npm run test:web
      - name: Build WebAssembly and the static application
        run: npm run build
        env:
          BASE_PATH: ./
      - name: Install the browser test runtime
        run: npx playwright install --with-deps chromium
      - name: Test the browser application
        run: npm run test:e2e
      - name: Configure the Pages project path
        if: inputs.pages
        shell: bash
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          if [[ "${REPOSITORY_NAME,,}" == "${REPOSITORY_OWNER,,}.github.io" ]]; then
            echo 'BASE_PATH=/' >> "$GITHUB_ENV"
          else
            echo "BASE_PATH=/$REPOSITORY_NAME/" >> "$GITHUB_ENV"
          fi
      - name: Build the validated source for GitHub Pages
        if: inputs.pages
        run: npm run build:web
      - name: Upload the Pages artifact
        if: inputs.pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
